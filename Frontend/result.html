<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Result — Online Examination System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Obafemi Awolowo University</div>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="primaryNav" aria-expanded="false"><span class="nav-toggle-bars"><i></i></span></button>
        <ul class="nav-links" id="primaryNav">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="result.html">Result</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>
    </nav>

    <main class="container">

        <h1 class="page-title text-center">Examination Result</h1>

        <div class="card result-card">
            <h2 id="studentName">Student Name</h2>
            <p id="examName" class="text-muted">Examination Name</p>

            <div class="score" id="score">0 / 50</div>
            <p id="percentage" class="text-muted">Percentage: 0%</p>

            <div class="result-details">
                <div class="result-box">
                    <h3 id="correctAnswers">0</h3>
                    <p>Correct Answers</p>
                </div>
                <div class="result-box">
                    <h3 id="wrongAnswers">0</h3>
                    <p>Wrong Answers</p>
                </div>
                <div class="result-box">
                    <h3 id="unanswered">0</h3>
                    <p>Unanswered</p>
                </div>
            </div>

            <div>
                <span class="status status-pass" id="status">PASS</span>
            </div>

            <div style="margin-top: var(--space-6);">
                <a href="dashboard.html" class="btn btn-primary">Back to Dashboard</a>
            </div>
        </div>

    </main>

    <footer data-standard-footer></footer>

    <script src="js/ui.js"></script>
</body>
</html>
