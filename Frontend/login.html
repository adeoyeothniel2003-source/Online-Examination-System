<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Online Examination System
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>

    <main class="container">

        <h1 class="page-title">
            Student Login
        </h1>

        <div class="card">

            <form action="#" method="post">

                <label for="email">
                    Email Address
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <label for="password">
                    Password
                </label>

                <br>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <br><br>

                <button type="submit"
                        class="btn btn-primary">
                    Login
                </button>

            </form>

            <br>

            <p>
                Don't have an account?
                <a href="#">
                    Register
                </a>
            </p>

        </div>

    </main>

    <footer>
        <p>Online Examination System</p>
    </footer>

</body>

</html>
