<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Online Examination System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Obafemi Awolowo University</div>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="primaryNav" aria-expanded="false"><span class="nav-toggle-bars"><i></i></span></button>
        <ul class="nav-links" id="primaryNav">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Student Login</a></li>
            <li><a href="admin-login.html">Admin Login</a></li>
        </ul>
    </nav>

    <main class="container auth-shell">

        <div class="card">
            <h1 class="page-title">Admin Login</h1>
            <p class="auth-subtitle">Administrator access for the examination system.</p>

            <form id="adminLoginForm" novalidate>

                <label for="admin-email">Admin email address</label>
                <input type="email" id="admin-email" name="email"
                       placeholder="admin@oauife.edu.ng"
                       autocomplete="email" required>

                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password"
                       placeholder="Enter admin password"
                       autocomplete="current-password" required>

                <p id="errorMessage" class="error-message" style="display: none;"></p>

                <button type="submit" class="btn btn-primary" id="adminLoginButton">
                    Log in as admin
                </button>
            </form>

            <p class="form-footer">
                Not an administrator?
                <a href="login.html">Sign in as a student</a>
            </p>
        </div>

    </main>

    <footer data-standard-footer></footer>

    <script src="js/ui.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('adminLoginButton');

            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const response = await fetch(
                    'https://online-examination-backend-mr8j.onrender.com/api/auth/login',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent = data.message || 'Invalid admin email or password.';
                    errorMessage.style.display = 'block';
                    loginButton.disabled = false;
                    loginButton.textContent = 'Log in as admin';
                    return;
                }

                if (!data.user || data.user.role !== 'admin') {
                    errorMessage.textContent = 'This account does not have administrator access.';
                    errorMessage.style.display = 'block';
                    loginButton.disabled = false;
                    loginButton.textContent = 'Log in as admin';
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'admin.html';

            } catch (error) {
                console.error('Admin login error:', error);
                errorMessage.textContent = 'Unable to connect to the server. Please try again.';
                errorMessage.style.display = 'block';
                loginButton.disabled = false;
                loginButton.textContent = 'Log in as admin';
            }
        });
    </script>
</body>
</html>
