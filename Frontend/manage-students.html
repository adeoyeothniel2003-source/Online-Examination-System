<!DOCTYPE html>
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
 
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0" 
    > 
 
    <title>Manage Students</title> 
 
    <link rel="stylesheet" href="css/style.css"> 
 
</head> 
 
<body> 
 
<div class="admin-container"> 
 
    <!-- SIDEBAR --> 
 
    <aside class="sidebar"> 
 
        <h2>Admin CMS</h2> 
 
        <a href="admin.html"> 
            Dashboard 
        </a> 
 
        <a href="manage-exams.html"> 
            Manage Exams 
        </a> 
 
        <a href="manage-questions.html"> 
            Manage Questions 
        </a> 
 
        <a href="manage-students.html" class="active"> 
            Students 
        </a> 
 
        <a href="manage-results.html"> 
            Results 
        </a> 
 
        <a href="../index.html"> 
            Logout 
        </a> 
 
    </aside> 
 
 
    <!-- MAIN CONTENT --> 
 
    <main class="main-content"> 
 
        <div class="page-header"> 
 
            <h1>Manage Students</h1> 
 
            <p> 
                View and manage registered students. 
            </p> 
 
        </div> 
 
 
        <div class="table-container"> 
 
            <h2>Registered Students</h2> 
 
 
            <div class="search-box"> 
 
                <input 
                    type="text" 
                    id="studentSearch" 
                    placeholder="Search students..." 
                > 
 
            </div> 
 
 
            <table> 
 
                <thead> 
 
                    <tr> 
 
                        <th>Name</th> 
 
                        <th>Email</th> 
 
                        <th>Phone</th> 
 
                        <th>Action</th> 
 
                    </tr> 
 
                </thead> 
 
 
                <tbody id="studentTableBody"> 
 
                </tbody> 
 
            </table> 
 
        </div> 
 
 
    </main> 
 
</div> 
 
 
<script src="js/admin.js"></script> 
 
</body> 
 
</html>
